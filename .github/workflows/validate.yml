name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate taxonomy data
        run: npm run validate

      - name: Check build script syntax
        run: node --check scripts/build-cn-graph.mjs

      - name: Test projection invariants
        run: npm run test
